# SECOP Intelligence — reverse proxy para autodata.jyrmecatronica.com
# Copiar a /etc/nginx/sites-available/autodata.jyrmecatronica.com y enlazar a sites-enabled.
# El bloque SSL lo añade certbot automáticamente tras `certbot --nginx -d autodata.jyrmecatronica.com`.

server {
    listen 80;
    listen [::]:80;
    server_name autodata.jyrmecatronica.com;

    access_log /var/log/nginx/autodata.access.log;
    error_log  /var/log/nginx/autodata.error.log;

    # Stream de trazabilidad en vivo (SSE). Debe ir SIN buffer para que los
    # eventos lleguen al panel a medida que ocurren, no todos al final.
    # (El backend ya envía 'X-Accel-Buffering: no'; esto lo refuerza a nivel de bloque.)
    location = /api/opportunities/stream {
        proxy_pass         http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;      # SSE: entregar cada evento al instante
        proxy_cache        off;
        proxy_read_timeout 600s;     # una corrida en frío puede superar los 60s por rate-limit
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass         http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # corridas de monitoreo en frío pueden tardar (rate-limit Croma)
    }
}
