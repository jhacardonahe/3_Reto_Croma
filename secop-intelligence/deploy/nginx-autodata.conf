# SECOP Intelligence — reverse proxy para autodata.jyrmecatronica.com
# Copiar a /etc/nginx/sites-available/autodata.jyrmecatronica.com y enlazar a sites-enabled.
# El bloque SSL lo añade certbot automáticamente tras `certbot --nginx -d autodata.jyrmecatronica.com`.

server {
    listen 80;
    listen [::]:80;
    server_name autodata.jyrmecatronica.com;

    access_log /var/log/nginx/autodata.access.log;
    error_log  /var/log/nginx/autodata.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # las corridas de monitoreo pueden tardar (rate-limit Croma)
    }
}
